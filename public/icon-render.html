<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Day-Day icon renderer</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
  #txt { position: absolute; left: 0; right: 0; top: 0; text-align: center; }
  .t1 { font-family: Georgia, 'Times New Roman', serif; color: #c9a96e; }
  .t2 { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; color: #f2ead8; }
  .t3 { font-family: Georgia, serif; color: #ffffff; opacity: 0.38; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="txt" style="display:none">
  <div class="t1" id="l1">D A Y - D A Y</div>
  <div class="t2" id="l2">观 星 台</div>
  <div class="t3" id="l3">STARGAZING, OFFLINE</div>
</div>
<script type="module">
import moon3d from '/client/moon-3d.js';

const q = new URLSearchParams(location.search);
const UP = +q.get('up') || 1; // 低分辨率渲染后放大（启动图压缩体积用）
const W = Math.round((+q.get('w') || 440) / UP), H = Math.round((+q.get('h') || 440) / UP);
const MOON = q.get('moon') === null ? 300 : +q.get('moon'); // moon=0 → 只画背景（自适应图标背景层用）
const PHASE = +(q.get('phase') ?? 0.25);
const STARS = q.get('stars') !== '0';
const GLOW = q.get('glow') !== '0';
const BGC = q.get('bg') !== '0';
const TXT = q.get('text') === '1';
const CX = +q.get('cx') || W / 2, CY = +q.get('cy') || H / 2;

const c = document.getElementById('c');
c.width = W * UP; c.height = H * UP;
const x = c.getContext('2d');
x.scale(UP, UP);

// 星空背景（固定种子，确定性）
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20261119);
const starColors = [
  [242, 234, 216], [219, 228, 255], [255, 227, 190],
  [208, 216, 255], [242, 234, 216], [255, 214, 170], [230, 240, 255]
];

if (BGC) {
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#141d3d');
  g.addColorStop(0.55, '#0a0e1f');
  g.addColorStop(1, '#060814');
  x.fillStyle = g;
  x.fillRect(0, 0, W, H);
}

if (STARS) {
  const n = Math.round((W * H) / (+q.get('sd') || 1500));
  const moonR = MOON / 2;
  for (let i = 0; i < n; i++) {
    const sx = rnd() * W, sy = rnd() * H;
    const d = Math.hypot(sx - CX, sy - CY);
    if (d < moonR * 0.92) continue; // 月面区域不画星
    const bright = rnd();
    const r = bright < 0.06 ? 1.6 + rnd() * 1.1 : 0.5 + rnd() * 1.0;
    const col = starColors[(rnd() * starColors.length) | 0];
    x.globalAlpha = bright < 0.06 ? 0.95 : 0.35 + rnd() * 0.5;
    x.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
    x.beginPath();
    x.arc(sx, sy, r, 0, Math.PI * 2);
    x.fill();
    if (bright < 0.02) {
      const gg = x.createRadialGradient(sx, sy, 0, sx, sy, r * 4);
      gg.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},0.5)`);
      gg.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
      x.globalAlpha = 1;
      x.fillStyle = gg;
      x.beginPath();
      x.arc(sx, sy, r * 4, 0, Math.PI * 2);
      x.fill();
    }
    x.globalAlpha = 1;
  }
}

// 月辉
if (MOON > 0 && GLOW) {
  const gr = MOON * 0.42;
  const gg = x.createRadialGradient(CX, CY, MOON * 0.45, CX, CY, gr);
  gg.addColorStop(0, 'rgba(214,190,140,0.20)');
  gg.addColorStop(0.55, 'rgba(201,169,110,0.10)');
  gg.addColorStop(1, 'rgba(201,169,110,0)');
  x.fillStyle = gg;
  x.beginPath();
  x.arc(CX, CY, gr, 0, Math.PI * 2);
  x.fill();
}

// 真实月面渲染
if (MOON > 0) {
  const moonCanvas = document.createElement('canvas');
  await moon3d.renderMoon(moonCanvas, { phase: PHASE }, MOON);
  x.drawImage(moonCanvas, Math.round(CX - MOON / 2), Math.round(CY - MOON / 2), MOON, MOON);

  // 暗面与背景的过渡光晕（月盘边缘微光）
  const eg = x.createRadialGradient(CX, CY, MOON * 0.46, CX, CY, MOON * 0.52);
  eg.addColorStop(0, 'rgba(150,160,200,0)');
  eg.addColorStop(1, 'rgba(150,160,200,0.08)');
  x.fillStyle = eg;
  x.beginPath();
  x.arc(CX, CY, MOON * 0.52, 0, Math.PI * 2);
  x.fill();
}

if (TXT) {
  const t = document.getElementById('txt');
  t.style.display = 'block';
  t.style.top = (q.get('ty') || Math.round(CY + MOON / 2 + H * 0.05)) + 'px';
  const scale = W / 320;
  t.style.fontSize = (15 * scale) + 'px';
  t.style.letterSpacing = (4 * scale) + 'px';
  document.getElementById('l2').style.fontSize = (12.5 * scale) + 'px';
  document.getElementById('l2').style.letterSpacing = (6 * scale) + 'px';
  document.getElementById('l3').style.fontSize = (8.5 * scale) + 'px';
  document.getElementById('l3').style.letterSpacing = (2 * scale) + 'px';
}

// 圆形裁剪（传统圆形图标用）
if (q.get('round') === '1') {
  x.globalCompositeOperation = 'destination-in';
  x.beginPath();
  x.arc(W / 2, H / 2, Math.min(W, H) / 2, 0, Math.PI * 2);
  x.fill();
}

window.__iconReady = true;
document.title = 'ready';
</script>
</body>
</html>
